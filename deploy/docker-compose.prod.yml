# Producción en VPS: docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
name: coperoco
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coperoco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: coperoco
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://coperoco:${POSTGRES_PASSWORD}@db:5432/coperoco
      PORT: 3000
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data]
volumes:
  pgdata:
  caddy_data:
